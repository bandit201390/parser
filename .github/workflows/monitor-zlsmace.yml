name: Monitor Stobix ZLSMACE strategy

on:
  workflow_dispatch:
    inputs:
      carry_state:
        description: Internal strategy state passed between monitor runs; leave unchanged.
        required: false
        type: string
        default: '{}'

permissions:
  actions: write
  contents: read

concurrency:
  group: stobix-zlsmace-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run strategy monitor tests
        run: npm test

      - name: Monitor Stobix strategy signals
        env:
          CARRY_STATE: ${{ inputs.carry_state }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_DURATION_MS: '20400000'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_STRATEGY_CHAT_ID }}
        run: node scripts/strategy-monitor.js
